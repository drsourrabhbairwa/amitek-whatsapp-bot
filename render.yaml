services:
  - type: web
    name: amitek-whatsapp-bot
    runtime: python
    region: singapore
    plan: starter            # free plan sleeps and would miss/delay WhatsApp replies
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: amitek-bot-db, property: connectionString}
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5
      - key: WA_API_URL
        value: https://crmapi.bluetickapi.com/api/meta
      - key: WA_API_VERSION
        value: v19.0
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: SEND_ENABLED
        value: "false"
      - key: BOT_MODE
        value: gentle          # phase 1: simple polite replies; "sales" = full sales head
      - key: HOT_LEAD_SLA_HOURS
        value: "2"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WA_ACCESS_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SALES_WHATSAPP
        sync: false
databases:
  - name: amitek-bot-db
    region: singapore
    plan: basic-256mb
