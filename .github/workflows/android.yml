name: Build Android app

on:
  push:
    branches: [main]
    paths: ['apps-script/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build single-file script and copy the app page
        run: |
          node apps-script/build.js
          mkdir -p android/app/src/main/assets/www
          cp apps-script/App.html android/app/src/main/assets/www/index.html

      - name: Test the script
        run: node apps-script/test/test.js && DIST=1 node apps-script/test/test.js

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle -p android assembleDebug --no-daemon
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Amitek-Leads.apk
          cp apps-script/dist/Amitek_Bot.gs out/Amitek_Bot.gs

      - uses: actions/upload-artifact@v4
        with:
          name: amitek-leads
          path: out/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Amitek Leads app ${{ github.run_number }}
          make_latest: true
          body: |
            Amitek-Leads.apk: install on Android (allow "install unknown apps").
            Amitek_Bot.gs: paste into the Google Sheet's Apps Script. See apps-script/SETUP.md.
          files: |
            out/Amitek-Leads.apk
            out/Amitek_Bot.gs
